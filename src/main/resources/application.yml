spring:
  application:
    name: core-api

  config:
    import: optional:file:.env[.properties]

  web:
    # Sem Accept-Language o Spring usaria o locale da JVM; o padrão do sistema é português
    locale: pt-BR

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  security:
    jwt:
      token:
        secret-key: ${JWT_SECRET:secret}
        expire-token-length: ${JWT_TOKEN_EXPIRE_LENGTH:3600000}
        expire-refresh-length: ${JWT_REFRESH_EXPIRE_LENGTH:86400000}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  mongodb:
    uri: ${MONGO_URL}
    auto-index-creation: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: true


brevo:
  enabled: ${BREVO_ENABLED:false}
  api:
    key: ${BREVO_API_KEY:}
    url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  sender:
    email: ${BREVO_SENDER_EMAIL:}
    name: ${BREVO_SENDER_NAME:Aether}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials: ${FIREBASE_CREDENTIALS:}

server:
  port: ${API_PORT:8080}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

inventory:
  worker:
    enabled: true
    poll-interval-ms: 5000
    batch-size: 10
    max-attempts: 3
    retry-delay-seconds: 30
    lock-ttl-seconds: 300
    download-timeout-seconds: 30
    max-file-size-mb: 10
    max-markdown-chars: 400000
    allowed-file-hosts: ${INVENTORY_ALLOWED_FILE_HOSTS:}
  generation-worker:
    enabled: true
    poll-interval-ms: 5000
    template-path: templates/planilha-inscricao.xlsx

aeko:
  base-url: ${AEKO_URL:http://localhost:8000}
  connect-timeout-seconds: 5
  read-timeout-seconds: 120
  authentication-key: ${INTERNAL_AUTHENTICATION_KEY:aether-dev}

oilpriceapi:
  base-url: https://api.oilpriceapi.com
  api-key: ${OILPRICEAPI_API_KEY:}
  timeout-seconds: 5
  cache-ttl-minutes: 30

exchange-rate:
  base-url: https://api.frankfurter.dev
  timeout-seconds: 5
  cache-ttl-minutes: 60

cors:
  origin-patterns: ${CORS_ORIGIN_PATTERNS:http://localhost:8080}
